[package]
name = "ffmpeg-queue-manager"
version = "0.2.0"
description = "Pure Rust FFmpeg Queue Manager with GUI and AI-ready CLI"
authors = ["Anthony"]
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.13"
rfd = "0.16"
mslnk = "0.1.8"
tray-icon = "0.24"
png = "0.18"
dirs = "6.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
