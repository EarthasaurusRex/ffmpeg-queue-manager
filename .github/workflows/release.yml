name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Pure Rust Release
        run: cargo build --release

      - name: Package Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item target\release\ffmpeg-queue-manager.exe dist-release\ffmpeg-queue-manager.exe
          Copy-Item src-tauri\bin\ffmpeg-x86_64-pc-windows-msvc.exe dist-release\ffmpeg.exe
          Copy-Item src-tauri\bin\ffprobe-x86_64-pc-windows-msvc.exe dist-release\ffprobe.exe
          Compress-Archive -Path dist-release\* -DestinationPath ffmpeg-queue-manager-windows-x86_64.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'FFmpeg Queue Manager ${{ github.ref_name }}'
          body: 'Pure Rust GUI & CLI release bundle for Windows x86_64.'
          draft: false
          prerelease: false
          files: |
            ffmpeg-queue-manager-windows-x86_64.zip
            dist-release\ffmpeg-queue-manager.exe
